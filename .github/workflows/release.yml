name: Release

# Model B: rilis hanya dipicu push tag `v*`. Workflow ini tidak berjalan pada
# push ke `main`, tidak membuat tag, dan tidak mendorong commit apa pun.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Gate rilis: job `release` hanya jalan kalau tes ini hijau.
  test:
    name: Tes sebelum rilis (${{ matrix.container }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:bookworm
          - fedora:latest
    container: ${{ matrix.container }}
    steps:
      - name: Pasang dependensi
        # git dibutuhkan actions/checkout; sisanya untuk tes dan unduhan.
        # Image Fedora tidak punya apt-get; dnf dipakai untuk keluarga itu.
        run: |
          set -euo pipefail
          case "${{ matrix.container }}" in
            fedora:*)
              dnf install -y ca-certificates coreutils curl git tar xz
              ;;
            *)
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                ca-certificates coreutils curl git tar xz-utils
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Tes hermetik
        run: bash tests/run.sh

  release:
    name: Tag & rilis otomatis
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout pada commit tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validasi tag dan VERSION
        id: version
        run: |
          set -euo pipefail

          # Model B: satu-satunya pemicu rilis adalah push tag `v*`.
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Rilis hanya dari push tag v*; ref sekarang: $GITHUB_REF" >&2
            exit 1
          fi

          tag="${GITHUB_REF#refs/tags/}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION tidak valid: '$version' (harus X.Y.Z)" >&2
            exit 1
          fi

          default_version="$(sed -n 's/^DEFAULT_VERSION="\([^"]*\)"$/\1/p' install.sh | head -n1)"
          if [[ "$default_version" != "$version" ]]; then
            echo "DEFAULT_VERSION di install.sh ($default_version) != VERSION ($version)." >&2
            echo "Samakan keduanya di commit yang diberi tag." >&2
            exit 1
          fi

          # Tag yang di-push harus menunjuk versi yang sama dengan isi commit-nya.
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag tidak cocok dengan VERSION ($version); tag harus v$version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag $tag cocok dengan VERSION $version."

      - name: Verifikasi checksum installer
        run: |
          set -euo pipefail
          if [[ ! -f install.sh.sha256 ]]; then
            echo "install.sh.sha256 tidak ada di commit tag." >&2
            exit 1
          fi
          if ! sha256sum -c install.sh.sha256; then
            echo "install.sh.sha256 tidak cocok dengan install.sh di commit tag." >&2
            exit 1
          fi

      - name: Terbitkan GitHub Release dari tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada; tidak ada yang perlu dibuat."
            exit 0
          fi
          # `--verify-tag` memakai tag yang sudah di-push dan tidak membuat
          # atau memindahkan ref apa pun. Aset diambil dari commit tag.
          gh release create "$TAG" --verify-tag \
            --title "osw $VERSION" \
            --generate-notes \
            install.sh install.sh.sha256
          echo "Rilis $TAG terbit."
