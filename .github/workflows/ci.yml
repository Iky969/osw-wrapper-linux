name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (bash -n & shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek sintaks
        run: bash -n bin/osw install.sh os/*.sh tests/*.sh

      - name: ShellCheck 0.10.0 (binary statis)
        env:
          # SHA-256 shellcheck-v0.10.0.linux.x86_64.tar.xz (2.404.716 byte).
          # Rilis v0.10.0 tidak menerbitkan file checksum; nilai ini dihitung
          # dari aset resmi GitHub dan cocok dengan lock Pants 2.32 serta
          # multitool.lock.json Selenium. Lihat TODOS.md.
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          version="0.10.0"
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSL --max-time 60 -o /tmp/shellcheck.tar.xz "$url"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" /tmp/shellcheck.tar.xz | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v${version}/shellcheck --version
          /tmp/shellcheck-v${version}/shellcheck -S warning \
            bin/osw install.sh os/*.sh tests/run.sh tests/smoke.sh tests/contract.sh

  test:
    name: Tes (${{ matrix.container }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:bookworm
    container: ${{ matrix.container }}
    steps:
      - name: Pasang dependensi
        # git dibutuhkan actions/checkout; sisanya untuk tes dan unduhan.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates coreutils curl git tar xz-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Tes hermetik
        run: bash tests/run.sh
